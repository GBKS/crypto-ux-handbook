[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "24"

# Apex → www (www is the canonical host, as on the old server).
[[redirects]]
  from = "https://cryptouxhandbook.com/*"
  to = "https://www.cryptouxhandbook.com/:splat"
  status = 301
  force = true

# Legacy article URLs.
[[redirects]]
  from = "/bdh/*"
  to = "/:splat"
  status = 301

# The old server published its sitemap at /sitemap.
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Built assets are content-hashed and never change.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
